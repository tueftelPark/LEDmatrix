<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LED Matrix Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="keywords" content="LED matrix, 8x8, matrix editor, matrix animation">
    <meta name="description" content="Online matrix editor: create images for LED matrix">
    <meta name="author" content="Xantorohara">

    <style>
        @media only screen and (min-height: 900px) {
            #frames { height: 400px; }
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="tp-logo.svg">
    <link rel="stylesheet" href="styles.css?1">
</head>

<body class="red-leds plain-theme">

<nav class="navbar">
    <span class="navbar-brand">
        <img src="tp-logo.svg" alt="tüftelPark" class="logo-mark">
        <span>tüftelPark<br><span class="brand-sub">LED Matrix Editor</span></span>
    </span>

    <span class="navbar-spacer"></span>

    <button id="save-code-button" type="button" title="Aktuellen Code als Datei speichern">
        <svg class="icon" viewBox="0 0 16 16" style="width:18px;height:18px;"><path d="M2 1h9l3 3v11H2V1zm2 2v3h6V3H4zm0 5v6h8V8H4z"/></svg>
        Code speichern
    </button>

    <div style="display:flex; align-items:center; gap:6px;">
        <div id="red-leds-case" class="leds-case" data-leds-theme="red-leds" style="background:#cc2222 radial-gradient(circle at 35% 35%, #ff6666, #cc0000);"></div>
        <div id="yellow-leds-case" class="leds-case" data-leds-theme="yellow-leds" style="background:#ccaa00 radial-gradient(circle at 35% 35%, #ffee66, #ccaa00);"></div>
        <div id="green-leds-case" class="leds-case" data-leds-theme="green-leds" style="background:#22aa22 radial-gradient(circle at 35% 35%, #66ff66, #00aa00);"></div>
        <div id="blue-leds-case" class="leds-case" data-leds-theme="blue-leds" style="background:#2233cc radial-gradient(circle at 35% 35%, #6688ff, #0022cc);"></div>
        <div id="white-leds-case" class="leds-case" data-leds-theme="white-leds" style="background:#eeeeee radial-gradient(circle at 35% 35%, #ffffff, #cccccc);"></div>
        <div id="black-leds-case" class="leds-case" data-leds-theme="black-leds" style="background:#1B2A41 radial-gradient(circle at 35% 35%, #2A3E5C, #0d1420);"></div>
        <button id="circuit-theme" title="Switch matrix theme" style="border:none;background:none;">
            <svg class="icon" viewBox="0 0 16 16" style="width:22px;height:22px;"><path d="M2 2h4v4H2V2zm8 0h4v4h-4V2zM2 10h4v4H2v-4zm8 0h4v4h-4v-4zM6 4h4M4 6v4M12 6v4M6 12h4" stroke="currentColor" fill="none" stroke-width="1.2"/></svg>
        </button>
    </div>
</nav>

<div class="navbar-colorbar">
    <span class="navbar-text" style="white-space:nowrap;">
        <svg class="navbar-icon" viewBox="0 0 16 16"><path d="M1 8l6-4v3h8v2H7v3z"/></svg>
        Zeichenfarbe wählen
    </span>
    <p id="color-container"></p>
    <span id="color-preview">
        <h1 id="color-show" class="color-0"></h1>
        <span id="color-word">0x00</span>
    </span>
    <span id="favorites-block" title="Leeren Punkt anklicken = aktuelle Farbe speichern. Gefüllten Punkt anklicken = Farbe auswählen. Rechtsklick = Favorit leeren.">
        <span class="navbar-text" style="white-space:nowrap;">Favoriten</span>
        <span id="favorites"></span>
    </span>
</div>

<div class="container-fluid">
    <div class="main-row">

        <div class="col-library">
            <h3>Library</h3>
            <ul id="sets">
                <li>Set №1:
                    <a href="#0x000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f202122232425262728292a2b2c2d2e2f303132333435363738393a3b3c3d3e3f|404142434445464748494a4b4c4d4e4f505152535455565758595a5b5c5d5e5f606162636465666768696a6b6c6d6e6f707172737475767778797a7b7c7d7e7f|808182838485868788898a8b8c8d8e8f909192939495969798999a9b9c9d9e9fa0a1a2a3a4a5a6a7a8a9aaabacadaeafb0b1b2b3b4b5b6b7b8b9babbbcbdbebf|c0c1c2c3c4c5c6c7c8c9cacbcccdcecfd0d1d2d3d4d5d6d7d8d9dadbdcdddedfe0e1e2e3e4e5e6e7e8e9eaebecedeeeff0f1f2f3f4f5f6f7f8f9fafbfcfdfeff">
                        colors
                    </a>
                    <a href="#181818181818181818fefe1818fefe1818ffff1818ffff1818ffff1818ffff18181818181818181818ff18181818ff181818ffffffff18181818181818181818|181818181818181818ffff1818ffff1818fefe1818fefe1818fefe1818fefe18181818181818181818181818181818181818ffffffff18181818181818181818|181818181818181818ffff1818ffff18fffefefffffefeff18ffff1818ffff181818181818181818181818181818ff181818ffffffff18181818181818181818">
                        emoji
                    </a>
                </li>
            </ul>
        </div>

        <div id="circuit" class="col-matrix">
            <table style="display:inline-block;">
                <tr>
                    <td>
                        <table id="matrix">
                            <tr>
                                <td id="matrix-toggle" title="Select/Clear all elements" style="cursor:pointer;">
                                    <svg class="icon" viewBox="0 0 16 16" style="width:20px;height:20px;"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg>
                                </td>
                                <td>
                                    <div id="cols-container"></div>
                                </td>
                                <td style="width: 15px;"></td>
                            </tr>
                            <tr>
                                <td id="rows-container"></td>
                                <td id="leds-container"></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td></td>
                                <td></td>
                                <td style="height: 15px;"></td>
                            </tr>
                        </table>
                    </td>
                    <td style="vertical-align: top;">
                        <div id="player">
                            <label for="play-delay-input" style="padding-right: 10px;">Play</label>
                            <input id="play-delay-input" type="number" min="100" value="500">
                            <small id="ms"> ms.</small>
                            <button id="play-button">
                                <svg id="play-button-play" class="icon" viewBox="0 0 16 16"><path d="M3 2l11 6-11 6V2z"/></svg>
                                <svg id="play-button-stop" class="icon" viewBox="0 0 16 16" style="display:none"><rect x="3" y="3" width="10" height="10"/></svg>
                            </button>
                        </div>
                        <div style="height: 25px;"></div>
                        <div id="shift-buttons-container">
                            <button id="shift-up-button" style="top:10px; left:50px;" title="Shift matrix up">
                                <svg class="icon" viewBox="0 0 16 16"><path d="M8 3l5 6H3z"/></svg>
                            </button>
                            <button id="shift-right-button" style="top:50px; left:90px;" title="Shift matrix right">
                                <svg class="icon" viewBox="0 0 16 16"><path d="M13 8l-6 5V3z"/></svg>
                            </button>
                            <button id="shift-down-button" style="top:90px; left:50px;" title="Shift matrix down">
                                <svg class="icon" viewBox="0 0 16 16"><path d="M8 13L3 7h10z"/></svg>
                            </button>
                            <button id="shift-left-button" style="top:50px; left:10px;" title="Shift matrix left">
                                <svg class="icon" viewBox="0 0 16 16"><path d="M3 8l6-5v10z"/></svg>
                            </button>
                        </div>
                        <div style="height: 25px;"></div>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <div id="edit-buttons-container">
                            <button id="insert-button" title="Insert matrix into the animation">Insert</button>
                            <button id="update-button" title="Update matrix in the animation">Update</button>
                            <button id="delete-button" title="Delete matrix from the animation">Delete</button>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" id="hex-input-row">
                        <label for="hex-input" style="padding: 0 10px 0 25px;">HEX</label>
                        <textarea id="hex-input" spellcheck="false"></textarea>
                    </td>
                </tr>
            </table>

            <div style="padding: 5px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                <small>
                    Use Drag-and-Drop to reorder matrices
                    <svg class="navbar-icon" viewBox="0 0 16 16" style="fill:#333;"><path d="M8 15l-6-4h3V1h6v10h3z"/></svg>
                </small>
                <span id="frame-count">0 Bilder</span>
            </div>

            <div id="frames"></div>
        </div>

        <div class="col-output">
            <div class="checkbox-row">
                <label><input type="checkbox" id="images-as-byte-arrays"> As byte arrays</label>
            </div>
            <h3>Arduino/C code</h3>
            <textarea id="output" spellcheck="false"></textarea>
            <div id="copy-buttons-container">
                <button id="copy-image-button" type="button" title="Nur die Werte des aktuellen Bildes kopieren, ohne Klammern">Bild kopieren</button>
                <button id="copy-animation-button" type="button" title="Werte aller Frames kopieren, ohne Klammern">Animation kopieren</button>
            </div>
        </div>

    </div>
</div>

<script src="scripts.js?1"></script>
</body>
</html>
